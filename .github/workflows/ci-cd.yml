name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/jeffreyvdb/searchxng-synthesis-proxy

jobs:
  changes:
    name: Detect build-relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}
      matched_files: ${{ steps.detect.outputs.matched_files }}
    steps:
      - name: Detect whether build should run
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const before = context.payload.before;
            const after = context.sha;

            // Handle initial pushes or force pushes where 'before' is all zeros.
            if (!before || before === '0000000000000000000000000000000000000000') {
              core.info('Initial push or force push detected; defaulting to should_build=true');
              core.setOutput('should_build', 'true');
              core.setOutput('matched_files', '<initial/force push: forced build>');
              return;
            }

            const response = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: before,
              head: after,
            });

            const files = (response.data.files || []).map(file => file.filename);

            const matched = files.filter(file =>
              file.endsWith('.go') ||
              file === 'go.mod' ||
              file === 'go.sum' ||
              file === 'Containerfile' ||
              file === '.dockerignore' ||
              file.startsWith('.github/workflows/')
            );

            core.info(`Changed files: ${files.join(', ') || '<none>'}`);
            core.info(`Matched build files: ${matched.join(', ') || '<none>'}`);

            core.setOutput('matched_files', matched.join(', '));
            core.setOutput('should_build', matched.length > 0 ? 'true' : 'false');

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  build-and-push:
    name: Build and push container
    runs-on: ubuntu-latest
    needs:
      - test
      - changes
    if: needs.changes.outputs.should_build == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=main
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=searchxng-synthesis-proxy
            org.opencontainers.image.description=Search Synthesis Proxy
            org.opencontainers.image.source=https://github.com/JeffreyVdb/searchxng-synthesis-proxy
            org.opencontainers.image.licenses=MIT

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
